<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-label="Memory photo of hands holding each other">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbb28e"/>
      <stop offset="45%" stop-color="#c09880"/>
      <stop offset="100%" stop-color="#746d69"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#f4d8b9"/>
      <stop offset="35%" stop-color="#d9b391"/>
      <stop offset="100%" stop-color="#5b504d"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <ellipse cx="590" cy="835" rx="500" ry="620" fill="url(#glow)" opacity="0.9"/>

  <g opacity="0.92">
    <!-- left forearm / hand -->
    <path d="M90 820 C160 620, 330 450, 570 510 C710 548, 820 634, 915 760 C960 818, 1000 885, 1040 960 C1088 1047, 1068 1284, 950 1390 C890 1446, 770 1478, 652 1476 C478 1470, 312 1416, 200 1282 C110 1160, 72 980, 90 820 Z" fill="#d6ae8f"/>
    <!-- right forearm / hand -->
    <path d="M520 610 C648 490, 786 458, 930 498 C1044 530, 1120 620, 1164 720 C1188 772, 1200 840, 1200 980 C1200 1138, 1128 1340, 1022 1432 C932 1510, 816 1528, 720 1496 C670 1480, 618 1456, 600 1418 C576 1360, 620 1284, 660 1218 C712 1136, 760 1018, 760 892 C760 796, 712 728, 656 690 C610 660, 560 632, 520 610 Z" fill="#cf9a77"/>
  </g>

  <g opacity="0.98">
