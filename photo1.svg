    <path d="M235 660 C310 620, 404 628, 470 676 C530 720, 612 785, 664 860 C730 946, 728 1088, 660 1168 C578 1260, 440 1268, 340 1208 C220 1138, 182 1018, 196 912 C206 846, 208 742, 235 660 Z" fill="#d9b18d"/>
    <path d="M820 620 C894 592, 980 592, 1044 630 C1108 670, 1160 736, 1178 822 C1194 904, 1180 1004, 1114 1064 C1048 1122, 948 1138, 874 1092 C786 1038, 758 946, 768 874 C776 782, 770 694, 820 620 Z" fill="#c98f6d"/>
  </g>

  <g>
    <!-- bracelet -->
    <path d="M146 930 C282 840, 420 832, 530 920 C556 940, 572 970, 570 996 C566 1060, 514 1100, 450 1098 C344 1096, 286 1064, 174 1000 C144 982, 132 954, 146 930 Z" fill="#a1302e"/>
    <path d="M462 898 C564 838, 656 850, 736 904 C772 928, 794 966, 794 1004 C795 1042, 776 1082, 748 1106 C696 1152, 598 1168, 528 1142 C444 1110, 414 1022, 462 898 Z" fill="#b4312f"/>
    <path d="M688 892 C744 850, 820 856, 882 892 C930 920, 954 972, 952 1018 C950 1066, 922 1110, 880 1138 C826 1170, 732 1182, 688 1148 C628 1106, 618 964, 688 892 Z" fill="#b43b33"/>
  </g>

  <!-- watch -->
  <g transform="translate(410 770)">
    <circle cx="0" cy="0" r="155" fill="#efe8df" stroke="#b38b58" stroke-width="18"/>
    <circle cx="0" cy="0" r="130" fill="#f6f1ea"/>
    <circle cx="0" cy="0" r="28" fill="#d4c5b4"/>
    <path d="M0 -85 L0 0 L50 50" fill="none" stroke="#7b5b3d" stroke-width="10" stroke-linecap="round"/>
    <path d="M-48 0 L0 0 L0 -48" fill="none" stroke="#7b5b3d" stroke-width="10" stroke-linecap="round"/>
    <path d="M-40 8 C-10 40, 12 40, 44 8" fill="none" stroke="#d29a61" stroke-width="14" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="20" fill="#b4aea4" opacity="0.6"/>
  </g>

  <!-- ring / small jewelry -->
  <g transform="translate(740 1060)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#d9c39d" stroke-width="8"/>
    <circle cx="0" cy="0" r="18" fill="#f0e7dd"/>
  </g>

  <!-- soft highlight / details -->
  <g opacity="0.35" filter="url(#blur)">
    <ellipse cx="410" cy="760" rx="190" ry="210" fill="#f8efe5"/>
    <ellipse cx="834" cy="830" rx="180" ry="220" fill="#f3e2d4"/>
  </g>
</svg>
